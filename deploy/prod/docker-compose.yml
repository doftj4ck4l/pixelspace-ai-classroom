# Production stack for the Pixelspace AI Classroom app (paic2, 10.0.0.42).
#
# Everything here runs with plain docker on a host where the deploy user has
# no root: the app container uses host networking (so 127.0.0.1:4010 — the pi
# harness — and 127.0.0.1:5433/9100 — Postgres/RustFS — are reachable), and
# gets the docker socket for sandbox siblings. Secrets live in ./prod.env,
# which is not committed.
#
#   docker compose -f deploy/prod/docker-compose.yml up -d --build

name: paic2-prod

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/prod/Dockerfile
    container_name: paic2-app
    network_mode: host
    env_file: ./prod.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    container_name: paic2-db
    environment:
      POSTGRES_USER: pixelspace
      POSTGRES_PASSWORD: pixelspace
      POSTGRES_DB: pixelspace_classroom
    # 5433: the host already runs an unrelated Postgres on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - paic2-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelspace -d pixelspace_classroom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: paic2-rustfs
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9100:9000"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

volumes:
  paic2-db-data:
  rustfs-data:

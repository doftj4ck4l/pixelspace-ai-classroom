# Postgres for pixelspace-ai-classroom.
#
# Lives next to the app on the same host, bound to loopback only — the app's
# server routes are the only client. Data sits in a named volume so recreating
# the container (or the app) never touches it.
services:
  db:
    image: postgres:18-alpine
    container_name: paic2-db
    environment:
      POSTGRES_USER: pixelspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelspace}
      POSTGRES_DB: pixelspace_classroom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paic2-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelspace -d pixelspace_classroom"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  paic2-db-data:
